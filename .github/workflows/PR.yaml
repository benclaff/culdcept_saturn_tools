on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master


name: Translation validations
run-name: ${{ github.actor }} is testing translation validity 🚀

jobs:
  test_python:
    name: Test python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.1.0
      - name: Set up Python 3
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - run: python --version
  test_offset:
    name: Test offsets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi      
      - run: python ./.github/test_scenario.py
