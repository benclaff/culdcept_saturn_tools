    sequence_2:
      start_relative_to_block: 162
      end_relative_to_block: 303
      portrait: 0f38
      original_txt: この世は光に満ちている\nしかし、果たしてそれが正しいのか？\w世界は光から始まったという\nしかし、光が生まれる前、世界は闇だったの\nではないか？\w
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_3:
      start_relative_to_block: 303
      end_relative_to_block: 440
      portrait: 0d39
      original_txt: 闇こそが世界の根源！\nそして闇を司るお方こそ邪神モルダビア様\nなのだ！\w見よ、西の峰を！\w今まさに、モルダビア様の復活が迫ろうと\nしている！
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_4:
      start_relative_to_block: 440
      end_relative_to_block: 513
      portrait: 0f03
      original_txt: ばかばかしい！\nおぬしがそのような教えを広めるから\nこの町は復興せんのだ\w
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_5:
      start_relative_to_block: 513
      end_relative_to_block: 533
      portrait: 0d00
      original_txt: 目を覚ますがよい！
