    sequence_1:
      start_relative_to_block: 75
      end_relative_to_block: 162
      portrait: 0f0e
      original_txt: \p、貴様もここへ来ていたのか\wちょうどいい\nこの神父が面白い話を聞かせてくれる\nらしいぜ
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
