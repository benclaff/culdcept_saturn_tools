    sequence_2:
      start_relative_to_block: 224
      end_relative_to_block: 479
      portrait: 0f30
      original_txt: フオッフオッフオッ・・・\wわしは、我が力を授けるに値するセプターを\n待っていたのだ\w破滅をもたらすとわしが言えば、大陸中から\n力あるセプターが集まってくる\wそのセプターらの中には、わしの力を使って\nこの世界を正しい方向に導いてくれる者も\nおるだろうと思ったのだ
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_3:
      start_relative_to_block: 479
      end_relative_to_block: 575
      portrait: 0f02
      original_txt: そういうことだったのか・・・\wなるほど・・・これで私も納得しましたぞ\nやはり、あんたは偉大な方だ
