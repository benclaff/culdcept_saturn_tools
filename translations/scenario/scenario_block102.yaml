      head_hexa: 180181
      portrait: 0f3e
      original_txt: \pよ\nわが奈落の居城へよくぞ来た\wフッフッフ・・・ゴリガンよ\nお手柄だ\wよくぞ最強のセプターをここへ\n招き入れることができたな
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_1:
      start_relative_to_block: 126
      end_relative_to_block: 154
      portrait: 0f0b
      original_txt: ゴリガン！！・・・貴様は！
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_2:
      start_relative_to_block: 154
      end_relative_to_block: 476
      portrait: 0f3e
      original_txt: さよう\nその杖は、私が残りわずかな力で創り上げた\nアーティファクトなのだ\wやつに力あるセプターを選ばせ、その者に\nバブラシュカ大陸の他のセプターを倒させる\wそうして得られたカードを、ここへ運ばせれば\n我が復活もたやすいこと\wカルドセプトさえ支配することができれば\nカルドラの呪縛など・・・\wいや、カルドラ自身さえ恐るるに足りん！\w
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_3:
      start_relative_to_block: 476
      end_relative_to_block: 565
      portrait: 0d40
      original_txt: \p！\nお前はまんまと、私の仕掛けたワナに\nはまったというわけだよ\wフハハハハハ・・・・！！
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_4:
      start_relative_to_block: 565
      end_relative_to_block: 642
      portrait: 0f03
      original_txt: ・・・・・・\wそうであったか・・・\n私は、大変な事をしてしまったようだ・・・\w
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_5:
      start_relative_to_block: 642
      end_relative_to_block: 815
      portrait: 0d01
      original_txt: ・・・・・・しかし、バルテアスよ\n私はもはや、おぬしの物ではないぞ\w私は\p殿にこのバブラシュカの\n平和を取り戻してもらうため、旅を供に\nしてきた\wその気持ちは今も変わらんのだ！
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_6:
      start_relative_to_block: 815
      end_relative_to_block: 1084
      portrait: 0f0e
      original_txt: バルテアス、腹心にも裏切られたようだな\wそれに貴様は、大きな過ちをおかしている\w大陸中のセプターを打ち破って来た\n\pは・・・\w今や貴様でさえ、容易に倒すことはできん\n相手になってしまったということさ\wさらに貴様は、大陸２番目の俺をも倒さねば\nカルドセプトの支配者にはなれない
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_7:
      start_relative_to_block: 1084
      end_relative_to_block: 1159
      portrait: 0f40
      original_txt: フフ・・・\w死すべき定めの人間どもが、神である私に\n刃向かおうというのか？\w
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_8:
      start_relative_to_block: 1159
      end_relative_to_block: 1204
      portrait: 0d41
      original_txt: よかろう\n自らの行為を悔やむ事になろうぞ！！
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_9:
      start_relative_to_block: 1204
      end_relative_to_block: 1222
      portrait: 0f00
      original_txt: \p殿！御武運を！
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
      translat_txt: null
    sequence_10:
      start_relative_to_block: 1222
      end_relative_to_block: 1253
      tail_hexa: 1800000082c882b500
      portrait: 0f0e
      original_txt: 協力はしないぜ、\p！
      ruler_helper: '-----------------------|-----------------------|-----------------------|'
